name: Asmodee Nightly Inventory Sync

on:
  schedule:
    # 10:00 UTC — offset an hour after the UD+Garland job (11:30 UTC) so
    # the two don't contend for Shopify's rate limit at the same time.
    # Shift to 11:00 UTC when clocks fall back to EST in November, same
    # as the seasonal note in the other workflow.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Asmodee nightly sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DRY_RUN: "true" # flip to "false" once you trust the digest output
        run: npm run run-asmodee
